<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母亲节快乐</title>
    <style>
        body { background: #fff5f7; text-align: center; font-family: sans-serif; overflow: hidden; }
        .flower { font-size: 80px; margin-top: 20vh; animation: grow 1.5s ease-out; }
        @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
        .text { color: #d81e06; font-size: 24px; font-weight: bold; margin-top: 20px; opacity: 0; transition: 2s; }
        .show { opacity: 1; }
        #btn { padding: 15px 30px; background: #ff85a2; color: white; border: none; border-radius: 25px; margin-top: 40vh; font-size: 18px; }
    </style>
</head>
<body>
    <div id="start"><button id="btn" onclick="start()">点开给妈妈的惊喜 ❤️</button></div>
    <div id="content" style="display:none">
        <div class="flower">🌸</div>
        <div id="msg" class="text">妈妈，母亲节快乐！<br>听妈妈的话，别让她受伤~</div>
    </div>
    <audio id="music" loop><source src="https://music.163.com/song/media/outer/url?id=185965.mp3" type="audio/mpeg"></audio>
    <script>
        function start(){
            document.getElementById('start').style.display='none';
            document.getElementById('content').style.display='block';
            document.getElementById('music').play();
            setTimeout(()=>{ document.getElementById('msg').classList.add('show'); }, 500);
        }
    </script>
</body>
</html>
