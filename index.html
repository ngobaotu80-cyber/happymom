<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>母亲节快乐</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#0f0f10;
    font-family:'Noto Serif SC', serif;
    height:100vh;
    width:100%;
    color:white;
}

.container{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.bg-glow{
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(255,120,150,0.18), transparent 70%);
    filter:blur(40px);
    animation:floatGlow 8s ease-in-out infinite;
}

@keyframes floatGlow{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-30px);}
    100%{transform:translateY(0px);}
}

.flower{
    width:260px;
    opacity:0;
    transform:translateY(40px) scale(0.9);
    animation:flowerShow 2.5s ease forwards;
    animation-delay:1s;
    z-index:2;
}

@keyframes flowerShow{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.text{
    margin-top:40px;
    text-align:center;
    opacity:0;
    transform:translateY(20px);
    animation:textShow 2s ease forwards;
    animation-delay:3s;
    z-index:2;
    padding:0 30px;
}

@keyframes textShow{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    font-size:38px;
    font-weight:500;
    letter-spacing:4px;
    margin-bottom:18px;
}

.desc{
    font-size:17px;
    line-height:2;
    color:rgba(255,255,255,0.82);
}

.light{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:0.5;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    20%{
        opacity:0.7;
    }
    to{
        transform:translateY(-10vh) scale(1.2);
        opacity:0;
    }
}

.hint{
    position:absolute;
    bottom:25px;
    font-size:12px;
    color:rgba(255,255,255,0.4);
    letter-spacing:2px;
}

.fade{
    position:absolute;
    inset:0;
    background:#000;
    animation:fadeOut 2s ease forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

@media(max-width:768px){
    .flower{
        width:210px;
    }

    .title{
        font-size:30px;
    }

    .desc{
        font-size:15px;
        line-height:1.9;
    }
}
</style>
</head>

<body>

<div class="fade"></div>

<div class="container">

    <div class="bg-glow"></div>

    <!-- 康乃馨 -->
    <img class="flower"
    src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1200&auto=format&fit=crop"
    />

    <!-- 文案 -->
    <div class="text">
        <div class="title">母亲节快乐</div>

        <div class="desc">
            愿时光温柔以待<br>
            愿岁月不染眉梢<br><br>

            谢谢您一直以来的爱与陪伴<br>
            您辛苦了 ❤️
        </div>
    </div>

    <div class="hint">
        Mother's Day
    </div>

</div>

<!-- 音乐 -->
<audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8e2b9fd.mp3?filename=beautiful-piano-ambient-110624.mp3" type="audio/mp3">
</audio>

<script>

// 粒子生成
for(let i=0;i<40;i++){

    const light=document.createElement('div');

    light.className='light';

    light.style.left=Math.random()*100+'vw';

    light.style.animationDuration=
        4+Math.random()*6+'s';

    light.style.animationDelay=
        Math.random()*5+'s';

    light.style.opacity=Math.random();

    document.body.appendChild(light);
}

// 微信内需要用户交互后播放
const bgm=document.getElementById('bgm');

function playMusic(){
    bgm.play();
    document.removeEventListener('click',playMusic);
    document.removeEventListener('touchstart',playMusic);
}

document.addEventListener('click',playMusic);
document.addEventListener('touchstart',playMusic);

</script>

</body>
</html>
